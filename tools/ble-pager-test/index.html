<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CrossPoint BLE Pager Test</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>CrossPoint BLE Pager Test</h1>
      <p class="intro">Connect to a device advertising as <code>CrossPoint Pager</code>, then send its three-line pager payload.</p>

      <section class="connection" aria-label="Bluetooth connection">
        <button id="connect" type="button">Connect Bluetooth</button>
        <button id="disconnect" type="button" disabled>Disconnect</button>
        <output id="connection-status" role="status">Not connected</output>
      </section>

      <section class="pager-policy" aria-labelledby="pager-policy-title">
        <div class="section-heading">
          <h2 id="pager-policy-title">X3 Pager policy</h2>
          <button id="refresh-policy" type="button" disabled>Refresh</button>
        </div>
        <output id="policy-status" role="status">Connect to read the device-owned policy.</output>
      </section>

      <form id="pager-form">
        <label>
          Title
          <input id="title" maxlength="80" value="Build complete" />
        </label>
        <label>
          Message
          <textarea id="message" maxlength="180" rows="4">Hello from the PC test page.</textarea>
        </label>
        <label>
          Footer
          <input id="footer" maxlength="56" value="CrossPoint BLE pager" />
        </label>
        <p id="payload-size" class="hint"></p>
        <button id="send" type="submit" disabled>Send pager update</button>
      </form>

      <output id="send-status" role="status"></output>
    </main>
    <script src="app.js"></script>
  </body>
</html>
